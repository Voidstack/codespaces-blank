
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SequenceGraph</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div id="debug"></div>
    <header class="app-toolbar">
        <strong>SequenceGraph</strong>
        <div class="toolbar-actions">
            <button id="export-graph" type="button">Export JSON</button>
            <button id="import-graph" type="button">Import JSON</button>
            <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
        <span id="graph-status" aria-live="polite"></span>
    </header>
    <div id="editor"></div>

    <script src="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.js"></script>

    <script src="js/node/aNode.js"></script>
    <script src="js/sequence.js?v=99999"></script>

</body>
</html>
